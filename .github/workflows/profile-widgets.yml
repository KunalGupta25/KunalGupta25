name: Refresh GitAscii profile widgets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Generate widget from GitHub pinned repositories
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/update_pinned_repos.py
      - name: Commit refreshed widget
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add assets/featured-repos.svg
          git diff --cached --quiet || git commit -m "Refresh GitHub pinned repositories widget"
          git push
